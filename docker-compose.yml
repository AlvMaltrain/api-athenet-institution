services:
  db:
    image: postgres:16-alpine
    container_name: athenet-institucion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-institucion_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - institucion_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # "image" es lo que se usa cuando se hace `docker compose pull` (EC2,
    # con la imagen que publica el pipeline). "build" es lo que se usa en
    # local con `docker compose up --build`.
    image: ${IMAGE:-ghcr.io/alvmaltrain/api-athenet-institution:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athenet-institucion-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-institucion_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  institucion_db_data:
