server:
  port: ${SERVER_PORT:8080}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/bfbc730b-74fb-4552-b74c-c93431273927/v2.0}

  application:
    name: institution-service


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/institucion_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

athenet:
  cors:
    # Origenes permitidos para consumir esta API desde el navegador
    # (separados por coma). Front admin y front publico, con sus
    # variantes locales de desarrollo.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}

logging:
  level:
    com.athenet.institution: DEBUG
